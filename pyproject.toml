[project]
name = "chess-yolo"
version = "0.1.0"
description = "Chess game transcription using YOLOv8 for piece detection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Aayush Bajaj", email = "aayushbajaj7@gmail.com"}
]

dependencies = [
    # Deep Learning
    "ultralytics>=8.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",

    # Computer Vision
    "opencv-python>=4.8.0",
    "opencv-contrib-python>=4.8.0",
    "albumentations>=1.3.0",

    # Chess Logic
    "chess>=1.10.0",

    # Tracking
    "supervision>=0.16.0",
    "lapx>=0.5.0",

    # Data Processing
    "roboflow>=1.1.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",

    # Utilities
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.65.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
train = [
    "tensorboard>=2.14.0",
    "wandb>=0.15.0",
    "matplotlib>=3.7.0",
]

inference = [
    "coremltools>=7.0",
    "onnx>=1.14.0",
    "onnxruntime>=1.16.0",
]

dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
chess-yolo-train = "scripts.train:main"
chess-yolo-infer = "scripts.inference:main"
chess-yolo-export = "scripts.export_model:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
